<html lang="de">
<head>

<meta name="theme-color" content="#12161a" media="(prefers-color-scheme: dark)">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lernplan">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: one narrow column like a lab notebook; day groups ruled by thin lines, module colour as a margin stripe, numbers in mono. */
:root {
  --bg: #eef0ec;
  --surface: #ffffff;
  --ink: #1a2024;
  --muted: #5f6a70;
  --line: #d6dbd5;
  --accent: #2550c4;
  --accent-soft: #e3e9fa;
  --late: #b8402a;
  --late-soft: #f8e6e1;
  --ok: #2b7d52;
  --ok-soft: #e1f1e7;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161a; --surface: #1b2126; --ink: #e8ece9; --muted: #98a3a8; --line: #2c343a;
    --accent: #7d9dff; --accent-soft: #23304f; --late: #ff8a70; --late-soft: #3a2420; --ok: #6fd39c; --ok-soft: #1d3428;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12161a; --surface: #1b2126; --ink: #e8ece9; --muted: #98a3a8; --line: #2c343a;
  --accent: #7d9dff; --accent-soft: #23304f; --late: #ff8a70; --late-soft: #3a2420; --ok: #6fd39c; --ok-soft: #1d3428;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font-body); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: .92em; }

.app { max-width: 760px; margin: 0 auto; padding: calc(12px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) calc(96px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); display: flex; flex-direction: column; gap: 18px; }
header.top { display: flex; flex-direction: column; gap: 10px; }
.top-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
h1 { font-size: 1.5rem; line-height: 1.2; margin: 0; font-weight: 700; letter-spacing: -.01em; text-wrap: balance; }
.sub { color: var(--muted); font-size: .9rem; }
.status { font-size: .8rem; color: var(--muted); background: none; border: 0; padding: 6px 0; text-decoration: underline; text-underline-offset: 3px; }
a { color: var(--accent); }
.status.warn { color: var(--late); }

nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--surface); border-top: 1px solid var(--line); display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom); }
nav.tabs .inner { display: grid; grid-template-columns: repeat(5, 1fr); width: 100%; max-width: 760px; }
nav.tabs a { text-decoration: none; color: var(--muted); font-size: .78rem; font-weight: 500; padding: 10px 4px 12px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 3px; }
nav.tabs a svg { width: 22px; height: 22px; }
nav.tabs a[aria-current="page"] { color: var(--accent); }
@media (min-width: 820px) {
  nav.tabs a { flex-direction: row; justify-content: center; gap: 8px; font-size: .9rem; padding: 14px 6px; }
  nav.tabs a svg { width: 18px; height: 18px; }
}

.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: .82rem; white-space: nowrap; }
.chip b { font-weight: 600; }
.chip.late { background: var(--late-soft); border-color: transparent; color: var(--late); }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }

.summary { display: grid; grid-template-columns: 1fr auto; gap: 6px 14px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.summary .big { font-size: 1.05rem; font-weight: 600; }
.bar { grid-column: 1 / -1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--ok); border-radius: 3px; }

section.group { display: flex; flex-direction: column; }
.group-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 0 2px 6px; border-bottom: 1px solid var(--line); }
.group-head h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; margin: 0; color: var(--muted); font-weight: 600; }
.group-head.today h2 { color: var(--accent); }
.group-head.late h2 { color: var(--late); }
.group-head .meta { font-size: .8rem; color: var(--muted); }
.empty { color: var(--muted); font-size: .9rem; padding: 12px 2px; }
.link-btn { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; font-size: .82rem; }

ul.items { list-style: none; margin: 0; padding: 0; }
li.item { border-bottom: 1px solid var(--line); }
.row { display: grid; grid-template-columns: 44px 1fr; align-items: start; min-height: 52px; }
.check { width: 44px; height: 48px; display: grid; place-items: center; background: none; border: 0; padding: 0; }
.check span { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--muted); display: grid; place-items: center; transition: background .15s, border-color .15s; }
.check:disabled { cursor: default; opacity: .6; }
.check[aria-pressed="true"] span { background: var(--ok); border-color: var(--ok); }
.check[aria-pressed="true"] span::after { content: ""; width: 10px; height: 5px; border: 2.5px solid #fff; border-top: 0; border-right: 0; transform: translateY(-1px) rotate(-45deg); }
.body { background: none; border: 0; text-align: left; padding: 11px 4px 11px 0; display: flex; flex-direction: column; gap: 3px; min-width: 0; border-left: 3px solid var(--mc, var(--line)); padding-left: 10px; margin: 6px 0; }
.title { font-weight: 500; overflow-wrap: anywhere; }
li.done .title { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--muted); }
.meta-line { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: .8rem; color: var(--muted); }
.meta-line .code { font-weight: 600; color: var(--ink); }
.tag { font-size: .72rem; font-weight: 600; padding: 1px 7px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); }
.tag.hi { background: var(--late-soft); color: var(--late); }
.tag.exam { background: var(--ink); color: var(--surface); }
li.exam .title { font-weight: 700; }
.detail { padding: 0 6px 14px 54px; display: flex; flex-direction: column; gap: 10px; }
.detail p { margin: 0; color: var(--muted); font-size: .9rem; max-width: 62ch; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 12px; font-size: .85rem; font-weight: 500; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.danger { color: var(--late); }
input[type="date"], input[type="text"], input[type="number"], select { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 10px; font-size: .9rem; min-height: 36px; }

.weeknav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.weeknav .label { font-weight: 600; }
.day-cap { font-size: .75rem; color: var(--muted); font-weight: 400; text-transform: none; letter-spacing: 0; }

.cards { display: grid; gap: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.card-head { width: 100%; background: none; border: 0; text-align: left; padding: 14px 16px; display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; border-left: 5px solid var(--mc); }
.card-head .name { font-weight: 600; }
.card-head .count { font-size: .85rem; color: var(--muted); text-align: right; }
.card-head .bar { margin-top: 4px; }
.card ul.items { border-top: 1px solid var(--line); padding: 0 8px; }
.card li.item:last-child { border-bottom: 0; }

.timeline { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.timeline li { display: grid; grid-template-columns: 74px 1fr auto; gap: 12px; align-items: center; padding: 12px 2px; border-bottom: 1px solid var(--line); }
.timeline .when { font-family: var(--font-num); font-size: .85rem; color: var(--muted); }
.timeline .left { font-family: var(--font-num); font-weight: 500; text-align: right; }
.timeline li.past { opacity: .55; }
.timeline .what { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.timeline .what b { font-weight: 600; }

.fab { position: fixed; right: max(18px, env(safe-area-inset-right)); bottom: calc(78px + env(safe-area-inset-bottom)); z-index: 6; width: 54px; height: 54px; border-radius: 16px; background: var(--accent); color: #fff; border: 0; box-shadow: 0 6px 18px rgba(20,40,90,.28); display: grid; place-items: center; }
.fab svg { width: 26px; height: 26px; }
@media (min-width: 820px) { .fab { right: calc(50% - 380px + 16px); } }

.sheet-bg { position: fixed; inset: 0; background: rgba(10,14,18,.45); z-index: 10; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 520px; border-radius: 16px 16px 0 0; padding: 18px 18px calc(18px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 12px; max-height: 90%; overflow: auto; }
@media (min-width: 620px) { .sheet-bg { align-items: center; } .sheet { border-radius: 16px; } }
.sheet h2 { margin: 0; font-size: 1.1rem; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: .8rem; color: var(--muted); font-weight: 500; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.lib-body { padding: 4px 16px 16px 21px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.lib-body p { margin: 0; max-width: 62ch; }
.lib-body p:first-child { margin-top: 12px; }
.lib-body ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; max-width: 62ch; }
.lib-body ul:first-child { margin-top: 12px; }
.lib-ev { font-size: .9rem; color: var(--muted); }
.lib-src { font-size: .8rem; color: var(--muted); }
.focus { position: sticky; top: env(safe-area-inset-top); z-index: 4; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--ink); color: var(--surface); border-radius: 12px; padding: 10px 14px; box-shadow: 0 6px 18px rgba(10,14,18,.25); }
.focus[hidden] { display: none; }
.focus.break { background: var(--ok); color: #fff; }
.focus.idle { background: var(--accent); color: #fff; }
.focus .f-time { font-size: 1.6rem; font-weight: 500; }
.focus .f-txt { flex: 1; min-width: 120px; font-size: .9rem; overflow-wrap: anywhere; }
.focus .f-sub { font-size: .78rem; opacity: .8; }
.focus .btn { color: #1a2024; background: #fff; border-color: transparent; }
.notice { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; color: var(--muted); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(150px + env(safe-area-inset-bottom)); background: var(--ink); color: var(--surface); padding: 9px 14px; border-radius: 10px; font-size: .85rem; z-index: 20; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="top-row">
      <h1 id="h1">Lernplan</h1>
      <button class="status" id="status" data-act="sync">Lade Lernplan …</button>
    </div>
    <div class="chips" id="examChips"></div>
  </header>
  <div id="focus" class="focus" hidden></div>
  <main id="main"><div class="notice">Lernplan wird geladen.</div></main>
</div>

<nav class="tabs" aria-label="Ansichten"><div class="inner">
  <a href="#heute" data-v="heute"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/><circle cx="12" cy="15" r="1.6" fill="currentColor"/></svg>Heute</a>
  <a href="#woche" data-v="woche"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h16"/><path d="M8 4v4M14 10v4M18 16v4"/></svg>Woche</a>
  <a href="#module" data-v="module"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>Module</a>
  <a href="#klausuren" data-v="klausuren"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 3.5h7l4 4V20a.5.5 0 0 1-.5.5h-10.5a.5.5 0 0 1-.5-.5V4a.5.5 0 0 1 .5-.5z"/><path d="M14 3.5V8h4M9 13h6M9 17h4"/></svg>Klausuren</a>
  <a href="#bibliothek" data-v="bibliothek"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 4.5h4v15H5zM9 4.5h4v15H9z"/><path d="M14.2 6.2l3.8-1 3.4 13.3-3.8 1z"/></svg>Bibliothek</a>
</div></nav>

<button class="fab" id="fab" aria-label="Aufgabe hinzufügen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg></button>
<div id="overlay"></div>

<script>
(function () {
  "use strict";
  let ARCHIVE = [];
  const LIB = {"src":{"dun":["Dunlosky u. a. 2013, Überblick über zehn Lerntechniken","https://www.psychologicalscience.org/news/releases/which-study-strategies-make-the-grade.html"],"roh":["Rohrer u. a. 2019, Feldstudie zu gemischtem Üben in Mathe","https://ies.ed.gov/use-work/awards/efficacy-study-interleaved-mathematics-practice"],"ren":["Atkinson, Renkl, Merrill 2003, Musterlösungen schrittweise ausblenden","https://asu.elsevierpure.com/en/publications/transitioning-from-studying-examples-to-solving-problems-effects-/"],"rei":["Reisslein u. a. 2006, Ausblenden bei Elektrotechnik-Aufgaben","https://faculty.engineering.asu.edu/mre/wp-content/uploads/sites/31/2020/02/Exp_Rev_LI06.pdf"],"raw":["Rawson und Dunlosky 2022, Successive Relearning","https://journals.sagepub.com/doi/full/10.1177/09637214221100484"],"biw":["Biwer u. a. 2023, feste Pausen gegen Pausen nach Gefühl","https://pubmed.ncbi.nlm.nih.gov/36859717/"],"smi":["Smits u. a. 2025, Pomodoro, Flowtime und freie Pausen","https://pmc.ncbi.nlm.nih.gov/articles/PMC12292963/"],"rui":["Ruiz Pardo und Minda 2022, Replikation der Handy-Studie","https://pubmed.ncbi.nlm.nih.gov/36007374/"]},"p":[{"id":"test","t":"Abfragen statt wiederlesen","k":"Stärkste Technik, für alle Fächer","p":"Hol den Stoff aus dem Kopf, bevor du ins Skript schaust. Das fühlt sich anstrengender an als Lesen und Markieren, bringt aber deutlich mehr.","l":["Rechenfach: Aufgabe ohne Lösung beginnen, erst nach einem ernsthaften Versuch vergleichen.","Lernfach: Skript zuklappen und ein leeres Blatt füllen. Was weiß ich zu diesem Kapitel?","Karteikarten nur als Frage und Antwort, nie als Zusammenfassung zum Durchlesen."],"e":"In einer großen Übersicht über zehn Lerntechniken bekamen nur zwei die höchste Bewertung: Selbsttests und verteiltes Lernen. Markieren und Wiederlesen schnitten schwach ab.","s":["dun"]},{"id":"spacing","t":"Verteilt lernen","k":"Stärkste Technik, steckt schon im Plan","p":"Derselbe Stoff an mehreren Tagen schlägt einen langen Block. Deshalb liegen deine Übungen im Wochenrhythmus und nicht alle kurz vor der Klausur.","l":["Lieber dreimal 30 Minuten über zwei Wochen als einmal 90 Minuten.","Der Sonntagsrückblick ist dafür da: Karten und Fehlerliste der Woche noch einmal abrufen.","Wenn du in Verzug kommst: Aufgaben verschieben, aber nicht auf einen Tag stapeln."],"e":"Verteiltes Lernen wirkt über Altersgruppen, Stoffarten und Prüfungsformen hinweg, auch bei Mathe und Problemlöseaufgaben.","s":["dun"]},{"id":"relearn","t":"Bis es sitzt, und dann noch einmal","k":"Für alles, was beim ersten Mal nicht klappt","p":"Eine Aufgabe ist nicht erledigt, wenn du die Lösung verstanden hast. Sie ist erledigt, wenn du sie an einem späteren Tag allein richtig löst.","l":["Aufgabe nicht geschafft: in der App auf „Saß nicht“ tippen. Sie kommt in 3 Tagen wieder.","Beim zweiten Mal wieder ohne Lösung starten.","Karteikarten nicht zu früh aussortieren. Einmal gewusst heißt noch nicht gelernt."],"e":"In Uni-Kursen lagen die Klausurergebnisse für so gelernte Inhalte etwa eine Notenstufe höher als für Inhalte, die Studierende auf ihre übliche Art gelernt hatten. Wer selbst entschied, wann eine Karte fertig ist, hatte den Vorteil nicht.","s":["raw"]},{"id":"mix","t":"Aufgabentypen mischen","k":"Für Rechenfächer vor der Klausur","p":"In der Klausur steht nicht dabei, welches Verfahren gefragt ist. Übungsblätter verraten es durch die Überschrift. Gemischtes Üben trainiert das Erkennen.","l":["Ab dem zweiten Durchgang: je eine Aufgabe aus drei verschiedenen Blättern statt ein Blatt am Stück.","Vor dem Rechnen in einem Satz aufschreiben: Welcher Aufgabentyp ist das, welches Verfahren passt?","Altklausuren sind von Natur aus gemischt. Deshalb liegen sie am Ende."],"e":"In einer Feldstudie mit 54 Schulklassen erreichte die Gruppe mit gemischten Aufgaben einen Monat später 61 Prozent, die Vergleichsgruppe 38 Prozent. Einschränkung: Das waren Siebtklässler, und gemischtes Üben dauert länger.","s":["roh","dun"]},{"id":"examples","t":"Erst Musterlösung, dann Lücken, dann allein","k":"Für neue Aufgabentypen","p":"Bei einem neuen Thema ist stundenlanges Herumprobieren ineffizient. Eine durchgerechnete Lösung zu studieren bringt am Anfang mehr. Sobald du den Typ kennst, kehrt sich das um.","l":["Neues Thema: eine Musterlösung Schritt für Schritt nachvollziehen.","Zweite Aufgabe: Lösung abdecken und nur die letzten Schritte selbst machen, dann immer mehr.","Thema bekannt: keine Musterlösung mehr vorab, sonst lernst du nur nachvollziehen."],"e":"Studien mit Ingenieurstudierenden an Schaltungsaufgaben zeigen: Einsteiger lernen mit Beispielen besser, bei Fortgeschrittenen verschwindet der Vorteil.","s":["rei","ren"]},{"id":"explain","t":"Jeden Schritt begründen","k":"Gegen Rechnen nach Schema","p":"Frag dich bei jedem Schritt: Warum darf ich das? Welches Gesetz, welche Annahme steckt dahinter?","l":["Bei Musterlösungen die Begründung an den Rand schreiben, die im Skript fehlt.","Bei Lernfächern: Warum ist das so? Wozu braucht man das? Was wäre die Alternative?","Wenn du einen Schritt nicht begründen kannst, gehört er in die Fehlerliste."],"e":"Selbsterklären und Warum-Fragen wurden in der Übersicht als mittelstark eingestuft, also nützlich, aber weniger breit belegt als Selbsttests.","s":["dun"]}],"f":[{"id":"breaks","t":"Feste Blöcke mit geplanten Pausen","k":"Hilft vor allem beim Anfangen","p":"Starte den Fokus-Timer auf der Heute-Seite oder direkt in einer Aufgabe, arbeite an genau einer Aufgabe und mach dann eine kurze Pause weg vom Bildschirm. 25 und 5 Minuten sind ein Startwert, bei Rechenaufgaben passen oft 45 und 10 besser.","l":["Vor dem Start aufschreiben, was am Ende des Blocks fertig sein soll.","Pause wirklich machen: aufstehen, trinken, kein Handy.","Wenn du gerade im Fluss bist, darfst du den Timer ignorieren."],"e":"Die Belege sind gemischt. In einer Studie waren Studierende mit festen Pausen konzentrierter und weniger müde als mit Pausen nach Gefühl. Eine neuere Studie fand das Gegenteil bei der Müdigkeit, und in beiden wurde am Ende gleich viel geschafft. Nimm, was für dich funktioniert.","s":["biw","smi"]},{"id":"phone","t":"Handy außer Reichweite","k":"Wenig Aufwand, Nutzen plausibel","p":"Leg das Handy beim Lernen in einen anderen Raum oder in die Tasche und stell Mitteilungen stumm. Wenn du diese App zum Abhaken brauchst, nimm sie am Mac.","l":["Fokus-Modus am iPhone für Lernzeiten einrichten.","Am Mac nur die Fenster offen lassen, die du für die Aufgabe brauchst."],"e":"Ehrlich eingeordnet: Die bekannte Studie, nach der schon ein ausgeschaltetes Handy auf dem Tisch die Denkleistung senkt, ließ sich in einer direkten Wiederholung nicht bestätigen. Der Tipp bleibt sinnvoll, weil Mitteilungen und der schnelle Griff zum Handy real unterbrechen. Das ist meine Einschätzung, kein Studienergebnis.","s":["rui"]},{"id":"start","t":"Den Einstieg klein machen","k":"Praxis-Tipp ohne Studienbeleg","p":"Die meiste Lernzeit geht vor dem Anfangen verloren. Mach den ersten Schritt lächerlich klein.","l":["Abends die Aufgabe für morgen aufschlagen und das Blatt hinlegen.","Feste Uhrzeit und fester Ort für den ersten Block des Tages.","Nur die erste Teilaufgabe vornehmen. Weitermachen ergibt sich meist von selbst.","Schwierigstes Fach zuerst, solange du frisch bist."],"e":"Diese Punkte stammen aus Erfahrung und nicht aus der Recherche. Probier sie aus und behalte, was hilft.","s":[]},{"id":"errors","t":"Fehlerliste führen","k":"Macht aus Fehlern Lernstoff","p":"Eine Seite pro Modul. Jeder Fehler bekommt eine Zeile: Was war falsch, warum, wie erkenne ich es nächstes Mal?","l":["Rechenfehler getrennt von Verständnisfehlern notieren.","Bei Rechenfehlern nach Mustern suchen, etwa Brüche, Potenzen, Vorzeichen, Einheiten.","Die Liste ist der Stoff für Sonntagsrückblick und Abschlusswiederholung."],"e":"Eine eigene Studie dazu habe ich nicht gesucht. Die Liste ist das Werkzeug, mit dem du Selbsttests und erneutes Lernen gezielt auf deine Schwächen richtest.","s":["raw"]}],"m":[{"mod":"informatik","k":"Praktische Prüfung am Rechner","l":["Jede Katalogaufgabe selbst tippen, kompilieren und laufen lassen. Lesen der Musterlösung zählt nicht.","Mit den mitgelieferten Testdateien prüfen, ob dein Programm stimmt.","Compilerfehler in die Fehlerliste: Meldung, Ursache, Korrektur.","Zeiger und malloc auf Papier skizzieren: Was zeigt wohin, wem gehört der Speicher?","Letzte Woche: Aufgaben mit Uhr neu schreiben, ohne in alte Lösungen zu sehen."],"use":["test","examples","relearn"]},{"mod":"bwl-3","k":"Rechenfach: Investition und Finanzierung","l":["Neun Aufgabenblätter mit Lösung sind dein Kernstoff. Jedes Blatt erst ohne Lösung rechnen.","Formeln aus dem Kopf aufschreiben, bevor du rechnest: Barwert, Annuität, ewige Rente, Anleihenpreis, Dividend-Discount-Model, WACC.","Zu jeder Formel einen Satz: Wann benutze ich sie, was nehme ich dabei an?","60 Minuten Klausur: gemischte Aufgaben mit Uhr üben, Taschenrechner sicher bedienen."],"use":["test","mix","relearn"]},{"mod":"mathe-3","k":"Rechenfach, Verfahren von Hand","l":["Jedes Verfahren einmal komplett von Hand durchrechnen: LR-Zerlegung, Iterationsverfahren, CG, Newton, Fourier.","Pro Verfahren eine Karte: Wann anwendbar, Schritte, typische Falle, Konvergenz.","Die Übungsblätter nennen oben die Sätze und Definitionen. Diese aus dem Kopf formulieren können.","Fünf Altklausuren ab Februar mit Uhr."],"use":["examples","mix","relearn"]},{"mod":"werkstoffkunde","k":"Lernfach, 393 Seiten Skript","l":["Kapitelweise: lesen, zuklappen, Diagramme aus dem Kopf zeichnen. Allen voran das Eisen-Kohlenstoff-Diagramm.","Je Kapitel zehn Karteikarten mit Frage und Antwort.","Zusammenhang immer mitlernen: Gefüge, Eigenschaft, Anwendung.","Prüfverfahren und Wärmebehandlungen als Vergleichstabelle.","Klausur liegt einen Tag vor Thermodynamik: Stoff muss am 20.02. stehen."],"use":["test","explain","spacing"]},{"mod":"thermodynamik","k":"Zwei Teile: Kurzfragen ohne, Rechnen mit Hilfsmitteln","l":["Kurzfragen bringen ein Drittel der Punkte und sind ohne Hilfsmittel. Die 155 Beispielfragen wie Karteikarten abfragen, verteilt über Wochen.","Rechenteil ist mit Skript: Du musst wissen, wo etwas steht. Skript mit Klebezetteln vorbereiten.","Immer gleiches Schema: System abgrenzen, Skizze, gegeben und gesucht, Annahmen, Bilanz, erst dann Zahlen.","Ergebnis auf Plausibilität prüfen. Offensichtlich unsinnige Lösungen kosten laut Aufgabensammlung Punkte."],"use":["test","spacing","explain"]},{"mod":"diskrete-steuerung-regelung","k":"Drei Blöcke: Automaten, Petri-Netze, zeitdiskrete Regelung","l":["Aufgabensammlung mit 33 Aufgaben und Lösungen: Aufgaben 1 bis 6 Automaten, 7 bis 17 Petri-Netze, 18 bis 33 Regelung und Zustandsraum.","Graphen und Netze selbst zeichnen, nie nur die Lösung ansehen.","Erlaubt ist ein handbeschriebenes A4-Blatt. Früh schreiben und in jeder Altklausur benutzen.","Kein Taschenrechner: Bruchrechnung und Polynome von Hand üben.","Klausur um 18 Uhr: mindestens eine der vier Altklausuren abends rechnen."],"use":["examples","test","mix"]},{"mod":"fertigungstechnik","k":"Lernfach mit vielen Verfahren","l":["Vergleichstabelle je Verfahrensgruppe: Prinzip, Werkstoffe, Genauigkeit, Vor- und Nachteile, typisches Bauteil.","Tabelle aus dem Kopf neu aufbauen, nicht abschreiben.","Skizzen der Verfahren beschriften können.","Warum-Fragen stellen: Warum dieses Verfahren für dieses Bauteil?"],"use":["test","explain","spacing"]},{"mod":"mathe-2","k":"Rechenfach, läuft dieses Semester mit","l":["Wöchentliche Blätter im Takt halten. Sternaufgaben sind Vertiefung und für die Großklausur zu schwer.","Ergebnisse müssen exakt und vollständig gekürzt sein, Rechenweg zählt. Jeden Umformungsschritt einzeln untereinander schreiben.","Alte Kurzklausuren sind ideale 30-Minuten-Tests zwischendurch.","Drei Großklausuren mit Lösung in der letzten Woche unter Klausurbedingungen."],"use":["test","relearn","mix"]},{"mod":"produktionssystematik","k":"Lernfach mit Rechenanteil","l":["Neun Foliensätze M01 bis M09: je Modul ein leeres Blatt aus dem Kopf füllen.","Kennzahlen (M07) und Investitionsrechnung (M09) an den Übungen 3 und 4 selbst rechnen.","Begriffe und Methoden als Karteikarten, früh anfangen.","Fällt mit Mathe 2 auf einen Tag: Stoff muss am 17.03. stehen."],"use":["test","spacing","relearn"]},{"mod":"elektrische-magnetische-felder","k":"150 Minuten, Kurzaufgaben plus große Aufgaben","l":["Vor jeder Rechnung das Feldbild skizzieren und die Symmetrie benennen.","14 Altklausuren mit Kurzlösung liegen im Ordner ET2. Das ist dein wichtigstes Material.","Nur Endergebnisse in den Lösungsfeldern zählen: sauber zusammenfassen, Einheiten angeben.","Erlaubt ist ein handbeschriebenes A4-Formelblatt zusätzlich zur Institutsformelsammlung. Nach drei Altklausuren schreiben."],"use":["explain","mix","relearn"]}]};
  const S = { entries: new Map(), modules: new Map(), view: "heute", week: 0, open: null, openCards: new Set(), ready: { e: false, m: false }, base: new Map(), ov: {} };
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // ---------- dates (device local time) ----------
  const pad = (n) => String(n).padStart(2, "0");
  const isoOf = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  const parse = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return isoOf(d); };
  const today = () => isoOf(new Date());
  const diff = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
  const fmtLong = new Intl.DateTimeFormat("de-DE", { weekday: "long", day: "numeric", month: "long" });
  const fmtShort = new Intl.DateTimeFormat("de-DE", { weekday: "short", day: "2-digit", month: "2-digit" });
  const fmtDM = new Intl.DateTimeFormat("de-DE", { day: "2-digit", month: "2-digit", year: "2-digit" });
  const hrs = (h) => (h ? String(h).replace(".", ",") + " h" : "");
  const hrs0 = (h) => String(h).replace(".", ",") + " h";
  const sumH = (list) => list.reduce((a, e) => a + (Number(e.hours) || 0), 0);
  function relDay(s) {
    const n = diff(today(), s);
    if (n === 0) return "heute"; if (n === 1) return "morgen"; if (n === -1) return "gestern";
    if (n > 1) return "in " + n + " Tagen"; return "vor " + (-n) + " Tagen";
  }

  // ---------- data helpers ----------
  const mod = (id) => S.modules.get(id);
  const isArchived = (e) => e.archived || (mod(e.moduleId) && mod(e.moduleId).archived);
  const active = () => [...S.entries.values()].filter((e) => !isArchived(e));
  const byDate = (a, b) => (a.date || "9999").localeCompare(b.date || "9999") || (a.type === "Klausur" ? -1 : 0) - (b.type === "Klausur" ? -1 : 0) || String(a.title).localeCompare(String(b.title), "de", { numeric: true });
  const exams = () => active().filter((e) => e.type === "Klausur").sort(byDate);

  // ---------- local state + sync ----------
  const LS = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    del(k) { try { localStorage.removeItem(k); } catch (e) {} }
  };
  function rebuild() {
    const m = new Map();
    for (const [id, b] of S.base) {
      const o = S.ov[id];
      if (!o) { m.set(id, b); continue; }
      const p = {}; ["done", "doneAt", "date"].forEach((k) => { if (k in o) p[k] = o[k]; });
      m.set(id, Object.assign({}, b, p));
    }
    for (const id in S.ov) { const o = S.ov[id]; if (!S.base.has(id) && o.title && !o.del) m.set(id, Object.assign({}, o, { id })); }
    S.entries = m;
  }
  function saveLocal() { LS.set("lp-ov", JSON.stringify(S.ov)); }
  function write(id, patch) {
    S.ov[id] = Object.assign({}, S.ov[id], patch, { u: Date.now() });
    saveLocal(); rebuild(); render(); queueSync();
  }
  function writeMany(ids, patchFn) { ids.forEach((id) => { S.ov[id] = Object.assign({}, S.ov[id], patchFn(id), { u: Date.now() }); }); saveLocal(); rebuild(); render(); queueSync(); }

  const API = "https://api.github.com", FILE = "lernplan-sync.json";
  let syncing = false, again = false, syncT;
  function setStatus(txt, warn) { const s = $("#status"); s.textContent = txt; s.classList.toggle("warn", !!warn); }
  function queueSync() { if (!LS.get("lp-token")) return; setStatus("Speichert …"); clearTimeout(syncT); syncT = setTimeout(sync, 1200); }
  async function gh(path, opt) {
    const r = await fetch(API + path, Object.assign({ cache: "no-store", headers: { Authorization: "Bearer " + LS.get("lp-token"), Accept: "application/vnd.github+json", "Content-Type": "application/json" } }, opt));
    if (!r.ok) { const e = new Error("http " + r.status); e.status = r.status; throw e; }
    return r.json();
  }
  async function sync() {
    if (!LS.get("lp-token")) { setStatus("Nur auf diesem Gerät · Sync einrichten", true); return; }
    if (syncing) { again = true; return; }
    syncing = true;
    try {
      let id = LS.get("lp-gist");
      if (!id) {
        const list = await gh("/gists?per_page=100");
        const g = list.find((x) => x.files && x.files[FILE]);
        if (g) id = g.id;
        else id = (await gh("/gists", { method: "POST", body: JSON.stringify({ description: "Lernplan-Sync", public: false, files: { [FILE]: { content: JSON.stringify({ v: 1, e: S.ov }) } } }) })).id;
        LS.set("lp-gist", id);
      }
      const g = await gh("/gists/" + id);
      const f = g.files && g.files[FILE];
      let remote = {};
      if (f) {
        let txt = f.content;
        if (f.truncated) txt = await (await fetch(f.raw_url, { cache: "no-store" })).text();
        try { remote = JSON.parse(txt).e || {}; } catch (e) {}
      }
      let pulled = false, push = false;
      for (const k in remote) { if (!S.ov[k] || (remote[k].u || 0) > (S.ov[k].u || 0)) { S.ov[k] = remote[k]; pulled = true; } }
      for (const k in S.ov) { if (!remote[k] || (S.ov[k].u || 0) > (remote[k].u || 0)) { push = true; break; } }
      if (pulled) { saveLocal(); rebuild(); render(); }
      if (push) await gh("/gists/" + id, { method: "PATCH", body: JSON.stringify({ files: { [FILE]: { content: JSON.stringify({ v: 1, e: S.ov }) } } }) });
      setStatus("Synchronisiert");
    } catch (err) {
      if (err.status === 401 || err.status === 403) setStatus("Token ungültig · neu einrichten", true);
      else if (err.status === 404) { LS.del("lp-gist"); setStatus("Sync-Datei fehlt · erneut tippen", true); }
      else setStatus("Offline · lokal gespeichert", true);
    }
    syncing = false;
    if (again) { again = false; sync(); }
  }
  function openSync() {
    const has = !!LS.get("lp-token");
    $("#overlay").innerHTML = '<div class="sheet-bg" data-close="1"><form class="sheet" id="syncForm" aria-labelledby="syncTitle"><h2 id="syncTitle">Synchronisierung</h2>' +
      '<p class="sub" style="margin:0">Damit iPhone und Mac denselben Stand zeigen, speichert die App deine Häkchen in einem geheimen Gist in deinem GitHub-Konto. Dafür brauchst du einmal ein Token mit dem Recht „gist“ und gibst es auf beiden Geräten ein.</p>' +
      '<p class="sub" style="margin:0"><a href="https://github.com/settings/tokens/new?scopes=gist&description=Lernplan-Sync" target="_blank" rel="noopener">Token bei GitHub erstellen</a></p>' +
      '<div class="field"><label for="f-token">GitHub-Token</label><input type="password" id="f-token" autocomplete="off" placeholder="' + (has ? "Token ist gespeichert" : "ghp_…") + '"></div>' +
      '<div class="actions"><button type="submit" class="btn primary">' + (has ? "Jetzt synchronisieren" : "Speichern und synchronisieren") + '</button>' +
      (has ? '<button type="button" class="btn danger" id="syncOff">Sync auf diesem Gerät trennen</button>' : "") + '<button type="button" class="btn" data-close="1">Schließen</button></div></form></div>';
    $("#syncForm").addEventListener("submit", (ev) => {
      ev.preventDefault();
      const v = $("#f-token").value.trim();
      if (v) { LS.set("lp-token", v); LS.del("lp-gist"); }
      $("#overlay").innerHTML = "";
      if (LS.get("lp-token")) { setStatus("Synchronisiert …"); sync(); }
    });
    const off = $("#syncOff");
    if (off) off.addEventListener("click", () => { LS.del("lp-token"); LS.del("lp-gist"); $("#overlay").innerHTML = ""; sync(); });
  }

  // ---------- focus timer (per device, not synced) ----------
  const FOC = { s: null, ac: null, key: "" };
  try { FOC.s = JSON.parse(LS.get("lp-focus") || "null"); } catch (e) {}
  function focSave() { if (FOC.s) LS.set("lp-focus", JSON.stringify(FOC.s)); else LS.del("lp-focus"); }
  function focStart(work, brk, title) {
    try { FOC.ac = FOC.ac || new (window.AudioContext || window.webkitAudioContext)(); FOC.ac.resume(); } catch (e) {}
    FOC.s = { mode: "work", end: Date.now() + work * 60000, work, brk, title: title || "" };
    LS.set("lp-focus-preset", work + "/" + brk); focSave(); focTick(); window.scrollTo(0, 0);
  }
  function focBeep() {
    try {
      const ac = FOC.ac; if (ac) [0, 0.35, 0.7].forEach((d) => {
        const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = 880; o.connect(g); g.connect(ac.destination);
        g.gain.setValueAtTime(0.15, ac.currentTime + d); g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + d + 0.25);
        o.start(ac.currentTime + d); o.stop(ac.currentTime + d + 0.26);
      });
    } catch (e) {}
    try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) {}
  }
  function focTick() {
    const el = $("#focus"), s = FOC.s;
    if (!s) { el.hidden = true; FOC.key = ""; return; }
    if (s.mode !== "idle" && s.end - Date.now() <= 0) {
      if (s.mode === "work") {
        const k = "lp-focus-" + today(); LS.set(k, String((Number(LS.get(k)) || 0) + 1));
        if (Date.now() - s.end < s.brk * 60000) { s.mode = "break"; s.end += s.brk * 60000; } else s.mode = "idle";
      } else s.mode = "idle";
      focBeep(); focSave();
    }
    const t = s.mode === "idle" ? 0 : Math.max(0, Math.ceil((s.end - Date.now()) / 1000));
    const time = pad(Math.floor(t / 60)) + ":" + pad(t % 60);
    const n = Number(LS.get("lp-focus-" + today())) || 0;
    const key = s.mode + "|" + n + "|" + s.title;
    if (key !== FOC.key) {
      FOC.key = key; el.hidden = false; el.className = "focus " + s.mode;
      const lbl = s.mode === "work" ? "Fokus" : s.mode === "break" ? "Pause" : "Pause vorbei";
      el.innerHTML = '<span class="f-time num" id="focTime"></span><span class="f-txt"><b>' + lbl + "</b>" + (s.title ? " · " + esc(s.title) : "") + '<br><span class="f-sub">' + n + (n === 1 ? " Block" : " Blöcke") + " heute geschafft</span></span>" +
        (s.mode === "idle" ? '<button class="btn" data-act="focNext">Nächster Block</button>' : "") + '<button class="btn" data-act="focStop">' + (s.mode === "idle" ? "Fertig" : "Beenden") + "</button>";
    }
    $("#focTime").textContent = time;
  }
  setInterval(focTick, 1000);

  let toastT;
  function toast(msg) {
    clearTimeout(toastT);
    let t = document.querySelector(".toast");
    if (!t) { t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
    t.textContent = msg;
    toastT = setTimeout(() => t.remove(), 2600);
  }

  // ---------- rendering ----------
  function itemHTML(e, opts = {}) {
    const m = mod(e.moduleId);
    const t = today();
    const late = !e.done && !e.ro && !isArchived(e) && e.date && e.date < t && e.type !== "Klausur";
    const meta = [];
    meta.push('<span class="code">' + esc(m ? m.code : "Allgemein") + "</span>");
    if (opts.showDate && e.date) meta.push('<span class="num">' + esc(fmtShort.format(parse(e.date))) + "</span>");
    if (!e.date) meta.push("<span>ohne Datum</span>");
    if (e.time) meta.push('<span class="num">' + esc(e.time) + "</span>");
    if (e.hours && e.type !== "Klausur") meta.push('<span class="num">' + hrs(e.hours) + "</span>");
    if (late && !opts.inLate) meta.push('<span style="color:var(--late)">überfällig</span>');

  focTick();
  (async function init() {
    try { S.ov = JSON.parse(LS.get("lp-ov") || "{}") || {}; } catch (e) { S.ov = {}; }
    let plan = null;
    try { const r = await fetch("plan.json", { cache: "no-cache" }); if (r.ok) { plan = await r.json(); LS.set("lp-plan", JSON.stringify(plan)); } } catch (e) {}
    if (!plan) { try { plan = JSON.parse(LS.get("lp-plan")); } catch (e) {} }
    if (!plan) { $("#main").innerHTML = '<div class="notice">Der Lernplan konnte nicht geladen werden. Prüfe die Internetverbindung und öffne die App erneut.</div>'; setStatus("Offline", true); return; }
    loadPlan(plan);
    sync();
    document.addEventListener("visibilitychange", () => { if (!document.hidden) { render(); sync(); } });
    setInterval(() => { if (!document.hidden && LS.get("lp-token")) sync(); }, 60000);
    if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
  })();
})();
</script>
</body>
</html>
